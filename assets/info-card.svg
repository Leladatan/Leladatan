<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">leladatan profile card</title>
  <desc id="desc">Fullstack engineer profile card</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0A1A"/>
      <stop offset="100%" stop-color="#1E1033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="1" y="1" width="718" height="218" rx="16"/>
    </clipPath>
  </defs>

  <rect width="720" height="220" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="718" height="218" rx="16" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.75"/>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="720" height="36" fill="#1A1028"/>
    <circle cx="22" cy="18" r="5" fill="#F87171"/>
    <circle cx="40" cy="18" r="5" fill="#FBBF24"/>
    <circle cx="58" cy="18" r="5" fill="#34D399"/>
    <text x="360" y="23" text-anchor="middle" fill="#A78BFA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">leladatan@github ~ profile</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#F5F3FF">
    <g opacity="1">
      <animate attributeName="opacity" from="0.25" to="1" begin="0.15s" dur="0.4s" fill="freeze"/>
      <text x="28" y="72"><tspan fill="#A78BFA">$</tspan> whoami</text>
      <text x="28" y="96" fill="#C4B5FD">leladatan · Fullstack Engineer · Moscow</text>
    </g>

    <g opacity="1">
      <animate attributeName="opacity" from="0.25" to="1" begin="0.55s" dur="0.4s" fill="freeze"/>
      <text x="28" y="128"><tspan fill="#A78BFA">$</tspan> stack</text>
      <text x="28" y="152" fill="#DDD6FE">TypeScript · Next.js · Node · React Native · Docker</text>
    </g>

    <g opacity="1">
      <animate attributeName="opacity" from="0.25" to="1" begin="0.95s" dur="0.4s" fill="freeze"/>
      <text x="28" y="184"><tspan fill="#A78BFA">$</tspan> builds</text>
      <text x="28" y="208" fill="#A1A1AA">web · APIs · mobile · bots · deploy — as one system</text>
    </g>
  </g>

  <rect x="660" y="188" width="10" height="18" fill="#A78BFA">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
