<svg xmlns="http://www.w3.org/2000/svg" width="680" height="220" viewBox="0 0 680 220" role="img" aria-labelledby="title desc">
  <title id="title">Leladatan profile card</title>
  <desc id="desc">Animated terminal-style card with role and stack</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0F2744"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="1" y="1" width="678" height="218" rx="16"/>
    </clipPath>
  </defs>

  <rect width="680" height="220" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="678" height="218" rx="16" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.7"/>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="680" height="36" fill="#111827"/>
    <circle cx="22" cy="18" r="5" fill="#F87171"/>
    <circle cx="40" cy="18" r="5" fill="#FBBF24"/>
    <circle cx="58" cy="18" r="5" fill="#34D399"/>
    <text x="340" y="23" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">leladatan@github ~ profile</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#E2E8F0">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.4s" fill="freeze"/>
      <text x="28" y="72"><tspan fill="#22D3EE">$</tspan> whoami</text>
      <text x="28" y="96" fill="#A5F3FC">Vladimir · Middle Frontend / Junior Backend</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.4s" fill="freeze"/>
      <text x="28" y="128"><tspan fill="#22D3EE">$</tspan> stack --core</text>
      <text x="28" y="152" fill="#67E8F9">Next.js · React · TypeScript · Tailwind · Prisma</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.4s" fill="freeze"/>
      <text x="28" y="184"><tspan fill="#22D3EE">$</tspan> focus</text>
      <text x="28" y="208" fill="#94A3B8">UI · FSD · product features · Node.js APIs</text>
    </g>
  </g>

  <rect x="620" y="188" width="10" height="18" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
