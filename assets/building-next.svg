<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">building next</title>
  <desc id="desc">What I build next across the fullstack continuum</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0A1A"/>
      <stop offset="100%" stop-color="#1E1033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="1" y="1" width="718" height="278" rx="16"/>
    </clipPath>
  </defs>

  <rect width="720" height="280" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="718" height="278" rx="16" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.75"/>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="720" height="36" fill="#1A1028"/>
    <circle cx="22" cy="18" r="5" fill="#F87171"/>
    <circle cx="40" cy="18" r="5" fill="#FBBF24"/>
    <circle cx="58" cy="18" r="5" fill="#34D399"/>
    <text x="360" y="23" text-anchor="middle" fill="#A78BFA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">leladatan@github ~ next</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#F5F3FF">
    <g opacity="1">
      <animate attributeName="opacity" from="0.25" to="1" begin="0.1s" dur="0.35s" fill="freeze"/>
      <text x="28" y="64"><tspan fill="#A78BFA">$</tspan> next --build</text>
    </g>
    <g opacity="1">
      <animate attributeName="opacity" from="0.25" to="1" begin="0.4s" dur="0.35s" fill="freeze"/>
      <text x="28" y="94" fill="#C4B5FD"><tspan fill="#7C3AED">&gt;</tspan> APIs &amp; services on Node / Next.js</text>
    </g>
    <g opacity="1">
      <animate attributeName="opacity" from="0.25" to="1" begin="0.7s" dur="0.35s" fill="freeze"/>
      <text x="28" y="122" fill="#C4B5FD"><tspan fill="#7C3AED">&gt;</tspan> product UI on React / Next.js</text>
    </g>
    <g opacity="1">
      <animate attributeName="opacity" from="0.25" to="1" begin="1.0s" dur="0.35s" fill="freeze"/>
      <text x="28" y="150" fill="#C4B5FD"><tspan fill="#7C3AED">&gt;</tspan> React Native apps for iOS &amp; Android</text>
    </g>
    <g opacity="1">
      <animate attributeName="opacity" from="0.25" to="1" begin="1.3s" dur="0.35s" fill="freeze"/>
      <text x="28" y="178" fill="#C4B5FD"><tspan fill="#7C3AED">&gt;</tspan> Telegram / Discord bots &amp; helpers</text>
    </g>
    <g opacity="1">
      <animate attributeName="opacity" from="0.25" to="1" begin="1.6s" dur="0.35s" fill="freeze"/>
      <text x="28" y="206" fill="#C4B5FD"><tspan fill="#7C3AED">&gt;</tspan> games, ML utilities, Dockerized deploys</text>
    </g>
    <g opacity="1">
      <animate attributeName="opacity" from="0.25" to="1" begin="1.9s" dur="0.35s" fill="freeze"/>
      <text x="28" y="248" fill="#A1A1AA"><tspan fill="#A78BFA">$</tspan> _</text>
    </g>
  </g>

  <rect x="52" y="234" width="10" height="18" fill="#A78BFA">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="2.1s" repeatCount="indefinite"/>
  </rect>
</svg>
